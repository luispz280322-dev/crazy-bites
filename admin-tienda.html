
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crazy Bites - Administración</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#fff7ed;color:#222;margin:0;padding:16px;max-width:1000px;margin:auto}
h1{color:#b52c18}
section{background:white;padding:16px;margin:15px 0;border-radius:12px;box-shadow:0 2px 8px #ddd}
input,button{font-size:16px;padding:10px;margin:5px 0;border-radius:7px;box-sizing:border-box}
input:not([type=checkbox]){width:100%;border:1px solid #ccc}
button{background:#b52c18;color:white;border:0;cursor:pointer}
table{width:100%;border-collapse:collapse}
td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}
.wrap{overflow-x:auto}
.hidden{display:none}
#status{background:#eee;padding:12px;border-radius:8px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>🌶️ Crazy Bites</h1>
<h2>Panel de administración</h2>
<p>Inicia sesión con tu cuenta administradora.</p>
<div id="status">Conectando...</div>

<section id="login">
<h3>Iniciar sesión</h3>
<input id="email" type="email" placeholder="Correo de administrador">
<input id="password" type="password" placeholder="Contraseña">
<button id="loginBtn">Entrar</button>
</section>

<div id="panel" class="hidden">
<section>
<p id="user"></p>
<button id="refreshBtn">Actualizar</button>
<button id="logoutBtn">Cerrar sesión</button>
</section>

<section>
<h3>Agregar producto</h3>
<input id="pn" placeholder="Nombre del producto">
<input id="pd" placeholder="Descripción">
<input id="pp" type="number" min="0" step="0.01" placeholder="Precio">
<input id="ps" type="number" min="0" step="1" placeholder="Existencia">
<label><input id="pav" type="checkbox" checked> Disponible</label><br>
<button id="addP">Agregar producto</button>
<h3>Productos registrados</h3>
<div class="wrap"><table><thead><tr><th>Producto</th><th>Precio</th><th>Stock</th><th>Disponible</th><th></th></tr></thead><tbody id="products"></tbody></table></div>
</section>

<section>
<h3>Agregar ingrediente</h3>
<input id="in" placeholder="Nombre del ingrediente">
<input id="ie" type="number" min="0" step="0.01" placeholder="Precio extra">
<input id="is" type="number" min="0" step="1" placeholder="Existencia">
<label><input id="iav" type="checkbox" checked> Disponible</label><br>
<button id="addI">Agregar ingrediente</button>
<h3>Ingredientes registrados</h3>
<div class="wrap"><table><thead><tr><th>Ingrediente</th><th>Extra</th><th>Stock</th><th>Disponible</th><th></th></tr></thead><tbody id="ingredients"></tbody></table></div>
</section>
</div>

<script>
const URL_SUPABASE="https://rqsscrkqucvpdsvywfzx.supabase.co";
const CLAVE_PUBLICA="sb_publishable_Szo8AiYpTfg6YY9DuGv9Nw_p4pV3RHw";
const db=supabase.createClient(URL_SUPABASE,CLAVE_PUBLICA);
const $=id=>document.getElementById(id);
const status=m=>$("status").textContent=m;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let productos=[],ingredientes=[];

async function comprobarAdmin(){
 const {data:{user},error:userError}=await db.auth.getUser();
 if(userError||!user){
  $("login").classList.remove("hidden");
  $("panel").classList.add("hidden");
  return false;
 }
 const {data,error}=await db.from("admin_users").select("user_id").eq("user_id",user.id).maybeSingle();
 if(error){
  await db.auth.signOut();
  status("No se pudieron comprobar los permisos de administrador: "+error.message);
  return false;
 }
 if(!data){
  await db.auth.signOut();
  status("Esta cuenta no aparece en la tabla admin_users como administrador.");
  return false;
 }
 $("login").classList.add("hidden");
 $("panel").classList.remove("hidden");
 $("user").textContent="Sesión: "+(user.email||"Administrador");
 await cargar();
 return true;
}

async function cargar(){
 status("Cargando datos...");
 const [p,i]=await Promise.all([
  db.from("products").select("id,name,description,price,stock,is_available").order("name"),
  db.from("ingredients").select("id,name,extra_price,stock,is_available").order("name")
 ]);
 if(p.error||i.error){
  status("Error al cargar: "+(p.error?.message||i.error?.message));
  return;
 }
 productos=p.data||[];
 ingredientes=i.data||[];
 $("products").innerHTML=productos.map(x=>`<tr>
 <td><input id="pn${esc(x.id)}" value="${esc(x.name)}"></td>
 <td><input id="pp${esc(x.id)}" type="number" min="0" step="0.01" value="${Number(x.price)}"></td>
 <td><input id="ps${esc(x.id)}" type="number" min="0" step="1" value="${Number(x.stock)}"></td>
 <td><input id="pa${esc(x.id)}" type="checkbox" ${x.is_available?"checked":""}></td>
 <td><button data-p="${esc(x.id)}">Guardar</button></td></tr>`).join("");
 $("ingredients").innerHTML=ingredientes.map(x=>`<tr>
 <td><input id="in${esc(x.id)}" value="${esc(x.name)}"></td>
 <td><input id="ie${esc(x.id)}" type="number" min="0" step="0.01" value="${Number(x.extra_price||0)}"></td>
 <td><input id="is${esc(x.id)}" type="number" min="0" step="1" value="${Number(x.stock)}"></td>
 <td><input id="ia${esc(x.id)}" type="checkbox" ${x.is_available?"checked":""}></td>
 <td><button data-i="${esc(x.id)}">Guardar</button></td></tr>`).join("");
 document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>guardarProducto(b.dataset.p));
 document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>guardarIngrediente(b.dataset.i));
 status("Datos cargados. Puedes editar los campos y pulsar Guardar.");
}

async function guardarProducto(id){
 const name=$("pn"+id).value.trim(),price=Number($("pp"+id).value),stock=Number($("ps"+id).value);
 if(!name||!Number.isFinite(price)||price<0||!Number.isInteger(stock)||stock<0){status("Revisa nombre, precio y existencia.");return}
 const {error}=await db.from("products").update({name,price,stock,is_available:$("pa"+id).checked}).eq("id",id);
 if(error){status("No se pudo guardar el producto: "+error.message);return}
 status("Producto actualizado.");await cargar();
}

async function guardarIngrediente(id){
 const name=$("in"+id).value.trim(),extra_price=Number($("ie"+id).value),stock=Number($("is"+id).value);
 if(!name||!Number.isFinite(extra_price)||extra_price<0||!Number.isInteger(stock)||stock<0){status("Revisa nombre, precio extra y existencia.");return}
 const {error}=await db.from("ingredients").update({name,extra_price,stock,is_available:$("ia"+id).checked}).eq("id",id);
 if(error){status("No se pudo guardar el ingrediente: "+error.message);return}
 status("Ingrediente actualizado.");await cargar();
}

$("loginBtn").onclick=async()=>{
 const email=$("email").value.trim(),password=$("password").value;
 if(!email||!password){status("Escribe tu correo y contraseña.");return}
 status("Iniciando sesión...");
 const {error}=await db.auth.signInWithPassword({email,password});
 if(error){status("Error de acceso: "+error.message);return}
 await comprobarAdmin();
};

$("addP").onclick=async()=>{
 const name=$("pn").value.trim(),description=$("pd").value.trim(),price=Number($("pp").value),stock=Number($("ps").value);
 if(!name||$("pp").value===""||$("ps").value===""||!Number.isFinite(price)||price<0||!Number.isInteger(stock)||stock<0){status("Completa nombre, precio y existencia correctamente.");return}
 const {error}=await db.from("products").insert({name,description,price,stock,is_available:$("pav").checked});
 if(error){status("No se pudo agregar: "+error.message);return}
 $("pn").value=$("pd").value=$("pp").value=$("ps").value="";
 status("Producto agregado.");await cargar();
};

$("addI").onclick=async()=>{
 const name=$("in").value.trim(),extra_price=Number($("ie").value),stock=Number($("is").value);
 if(!name||!Number.isFinite(extra_price)||extra_price<0||!Number.isInteger(stock)||stock<0){status("Completa nombre, precio extra y existencia.");return}
 const {error}=await db.from("ingredients").insert({name,extra_price,stock,is_available:$("iav").checked});
 if(error){status("No se pudo agregar: "+error.message);return}
 $("in").value="";$("ie").value="";$("is").value="";
 status("Ingrediente agregado.");await cargar();
};

$("refreshBtn").onclick=cargar;
$("logoutBtn").onclick=async()=>{await db.auth.signOut();$("panel").classList.add("hidden");$("login").classList.remove("hidden");status("Sesión cerrada.");};

(async()=>{
 const {data:{session}}=await db.auth.getSession();
 if(session) await comprobarAdmin();
 else status("Listo. Inicia sesión con tu cuenta administradora.");
})();
</script>
</body>
</html>
